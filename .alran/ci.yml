version: 1
enabled: true
trigger:
  workflows:
    - ci
    - cli-release
    - compatibility
    - label-issue-product
    - performance
    - security
    - source-candidate
mode:
  pull_request: push-to-branch
  main: fix-pr
limits:
  max_attempts: 2
  max_diff_lines: 300
  timeout_minutes: 15
  max_runs_per_day: 10
  max_tokens: 200000
guards:
  deny_paths:
    - .github/workflows/**
    - .alran/ci.yml
    - '**/.env'
    - '**/.env.*'
    - '**/*.pem'
    - '**/*.key'
    - '**/*.p12'
    - '**/secrets/**'
  forbid_test_weakening: true
model:
  base_url: https://ai.ottili.one/v1
  name: ottili/werk-1.1
  api_key_secret: ALRAN_API_KEY
